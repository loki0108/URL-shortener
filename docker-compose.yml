services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    volumes:
      - pgdata:/var/lib/postgresql/data   # keep data when containers are removed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Inside Compose, services reach each other by service name ("db", "redis")
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is actually ready
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: